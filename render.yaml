services:
  - type: web
    name: prompt2tube
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 600 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GOOGLE_TOKEN_JSON
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.6
