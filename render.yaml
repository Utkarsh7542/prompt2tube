services:
  - type: web
    name: prompt2tube
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Rendering is now ASYNC. POST /generate enqueues a job and returns
    # immediately; a background worker does the render (minutes to an hour) and
    # the browser polls /jobs/<id>. So the web request no longer needs a giant
    # timeout. start.sh runs the web server AND the worker in this one container
    # so they share the SQLite job database. (See start.sh for why one container.)
    startCommand: bash start.sh
    envVars:
      # --- BYOK demo: testers bring their own paid keys ---
      # Runpod (render) and Fish (voice) keys are entered per render by each
      # tester, encrypted with their job, and wiped when it finishes. So do NOT
      # set RUNPOD_API_KEY / FISH_API_KEY here -- leaving them unset is what
      # forces BYOK. (If you ever want a shared fallback instead, add them back.)

      # Script generation stays server-side; Gemini's free tier is cheap and
      # asking testers for a third key is friction. You provide this one.
      - key: GEMINI_API_KEY
        sync: false

      # REQUIRED and STABLE: this key encrypts the testers' per-job keys. It must
      # be set (not auto-generated) so the app and worker share it reliably.
      # Generate one with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: HUB_VAULT_KEY
        sync: false

      # --- optional ---
      - key: HF_TOKEN              # only for the free HuggingFace renderer
        sync: false
      - key: HUB_REDIRECT_BASE    # only if you enable publishing
        sync: false

      - key: PYTHON_VERSION
        value: "3.12.6"
